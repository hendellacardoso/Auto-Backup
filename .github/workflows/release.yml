# Build e release do API2Dev Backup (Windows x64)
#
# Dispara ao enviar uma tag "v*" (ex.: v1.0.0) ou manualmente (Actions > Release > Run workflow).
#
# Assinatura com a SignPath (SignPath Foundation):
#   - Ativada quando o secret SIGNPATH_API_TOKEN e a variável SIGNPATH_ORGANIZATION_ID existem no repositório.
#   - Sem eles, o workflow gera e publica os executáveis SEM assinatura (útil para a primeira release).
#   1. O app empacotado (release/win-unpacked) é enviado para assinar "API2Dev Backup.exe".
#   2. O instalador e o portátil são gerados a partir do app já assinado e enviados para assinar também.
#   Cada pedido de assinatura precisa ser aprovado manualmente no painel da SignPath.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SIGNPATH_PROJECT_SLUG: Auto-Backup
  SIGNPATH_POLICY_SLUG: release-signing

jobs:
  build:
    runs-on: windows-latest
    env:
      ASSINAR: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "versao=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "A tag $env:GITHUB_REF_NAME não corresponde à versão do package.json (v$v)."
          }
          Write-Host "Versão: $v  |  Assinar: $env:ASSINAR"

      - name: Instalar dependências
        run: npm ci

      - name: Empacotar o aplicativo (win-unpacked)
        run: npm run dist:dir

      # ------------------------------------------------ assinatura 1: executável do aplicativo
      - name: Enviar app para assinatura
        if: env.ASSINAR == 'true'
        id: app-sem-assinatura
        uses: actions/upload-artifact@v4
        with:
          name: app-sem-assinatura
          path: release/win-unpacked/
          if-no-files-found: error

      - name: Assinar app (SignPath)
        if: env.ASSINAR == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app-sem-assinatura.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: assinado/app

      - name: Usar app assinado
        if: env.ASSINAR == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force release/win-unpacked
          Copy-Item -Recurse assinado/app release/win-unpacked
          Get-AuthenticodeSignature "release/win-unpacked/API2Dev Backup.exe" | Format-List Status, SignerCertificate

      # ------------------------------------------------ instalador e portátil
      - name: Gerar instalador e portátil
        run: npm run dist:instaladores

      - name: Enviar instaladores para assinatura
        if: env.ASSINAR == 'true'
        id: instaladores-sem-assinatura
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-sem-assinatura
          path: |
            release/API2Dev-Backup-Setup-${{ steps.versao.outputs.versao }}.exe
            release/API2Dev-Backup-Portatil-${{ steps.versao.outputs.versao }}.exe
          if-no-files-found: error

      - name: Assinar instaladores (SignPath)
        if: env.ASSINAR == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: instaladores
          github-artifact-id: ${{ steps.instaladores-sem-assinatura.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: assinado/instaladores

      - name: Usar instaladores assinados
        if: env.ASSINAR == 'true'
        shell: pwsh
        run: Copy-Item -Force assinado/instaladores/*.exe release/

      # ------------------------------------------------ publicação
      # Nomes fixos (sem versão) para o link de download nunca mudar:
      #   https://github.com/hendellacardoso/Auto-Backup/releases/latest/download/API2Dev-Backup.exe   (instalador)
      #   https://github.com/hendellacardoso/Auto-Backup/releases/latest/download/API2Dev-Backup-Portatil.exe
      - name: Nomes finais e SHA-256
        shell: pwsh
        run: |
          $v = '${{ steps.versao.outputs.versao }}'
          New-Item -ItemType Directory -Force publicar | Out-Null
          Copy-Item "release/API2Dev-Backup-Setup-$v.exe"    publicar/API2Dev-Backup.exe
          Copy-Item "release/API2Dev-Backup-Portatil-$v.exe" publicar/API2Dev-Backup-Portatil.exe
          Get-ChildItem publicar/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 publicar/SHA256SUMS.txt
          Get-Content publicar/SHA256SUMS.txt

      - name: Guardar executáveis
        uses: actions/upload-artifact@v4
        with:
          name: API2Dev-Backup-${{ steps.versao.outputs.versao }}
          path: publicar/

      # Publica na tag enviada (publicar-release.bat) ou, ao rodar manualmente em Actions > Release > Run workflow,
      # cria a tag v<versão do package.json> automaticamente.
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: API2Dev Backup ${{ steps.versao.outputs.versao }}
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            publicar/API2Dev-Backup.exe
            publicar/API2Dev-Backup-Portatil.exe
            publicar/SHA256SUMS.txt

      # Remove da release arquivos com outros nomes (ex.: os antigos com a versão no nome)
      - name: Limpar arquivos antigos da release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.versao.outputs.versao }}'
          $manter = @('API2Dev-Backup.exe', 'API2Dev-Backup-Portatil.exe', 'SHA256SUMS.txt')
          $assets = (gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets
          foreach ($a in $assets) {
            if ($manter -notcontains $a.name) {
              Write-Host "Removendo $($a.name)"
              gh release delete-asset $tag $a.name --repo $env:GITHUB_REPOSITORY --yes
            }
          }

